<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Selected wallets keep a +12 to +14 point return spread for 8 weeks while half of them stop trading, at the same rate as a placebo group"><rect x="0.5" y="0.5" width="879" height="371" rx="10" fill="#1a1a19" stroke="#34342f"/><text x="28.0" y="38.0" fill="#ffffff" font-size="17" font-weight="600" text-anchor="start" >Wallets picked on past returns vs a placebo group, 1 to 8 weeks later</text><text x="28.0" y="60.0" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start" >Wallet list frozen, then read forward with no re-pick. 4.14M wallets, 19 weeks.</text><rect x="28" y="79" width="10" height="10" rx="2" fill="#3987e5"/><text x="44.0" y="88.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" >Wallets selected on past returns</text><rect x="262.8" y="79" width="10" height="10" rx="2" fill="#d95926"/><text x="278.8" y="88.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" >Placebo: same activity filters, no return filter</text><text x="60.0" y="116.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="start" >Return spread vs all wallets (pp)</text><line x1="60" y1="320.0" x2="390" y2="320.0" stroke="#4a4a45"/><text x="52.0" y="324.0" fill="#8f8e86" font-size="12" font-weight="400" text-anchor="end" >0</text><line x1="60" y1="273.0" x2="390" y2="273.0" stroke="#2a2a28"/><text x="52.0" y="277.0" fill="#8f8e86" font-size="12" font-weight="400" text-anchor="end" >4</text><line x1="60" y1="226.0" x2="390" y2="226.0" stroke="#2a2a28"/><text x="52.0" y="230.0" fill="#8f8e86" font-size="12" font-weight="400" text-anchor="end" >8</text><line x1="60" y1="179.0" x2="390" y2="179.0" stroke="#2a2a28"/><text x="52.0" y="183.0" fill="#8f8e86" font-size="12" font-weight="400" text-anchor="end" >12</text><line x1="60" y1="132.0" x2="